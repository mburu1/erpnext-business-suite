[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "business-suite"
version = "0.1.0"
description = "ERPNext business-suite extensions and domain workflows."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.31,<3"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["business_suite*"]
