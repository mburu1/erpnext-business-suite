<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Request Detail — Business Suite</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/app.css"></head><body><div data-navigation></div><main class="main"><header class="topbar"><strong>Stock Request Detail</strong><span data-user></span></header><section class="content"><div class="toolbar"><div><h1>Stock Request</h1><p class="page-subtitle">ERPNext document detail with server-side workflow enforcement.</p></div><a class="btn" href="stock-requests.html">Back</a></div><div class="card" data-detail>Loading…</div></section></main><script type="module">import{bootstrap}from"../js/app.js";import{api}from"../js/api/client.js";import{escapeHtml,dateTime,badge,number}from"../js/utils/formatters.js";if(await bootstrap("stock-requests")){const n=new URLSearchParams(location.search).get("name");try{const r=await api.resource("Stock%20Request/"+encodeURIComponent(n));const d=r.data;document.querySelector("[data-detail]").innerHTML='<dl class="detail"><dt>ID</dt><dd>'+escapeHtml(d.name)+'</dd><dt>Requested By</dt><dd>'+escapeHtml(d.requested_by)+'</dd><dt>Customer</dt><dd>'+escapeHtml(d.business_customer)+'</dd><dt>Warehouse</dt><dd>'+escapeHtml(d.warehouse)+'</dd><dt>Priority</dt><dd>'+badge(d.priority)+'</dd><dt>Status</dt><dd>'+badge(d.status)+'</dd><dt>Requested On</dt><dd>'+dateTime(d.requested_on)+'</dd><dt>Approved By</dt><dd>'+escapeHtml(d.approved_by)+'</dd><dt>Fulfilled On</dt><dd>'+dateTime(d.fulfilled_on)+'</dd><dt>Items</dt><dd>'+number(d.items?.length)+'</dd></dl>'}catch(e){document.querySelector("[data-detail]").innerHTML='<div class="alert error">'+escapeHtml(e.message)+"</div>"}}</script></body></html>
