<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Detail — Business Suite</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/app.css"></head><body><div data-navigation></div><main class="main"><header class="topbar"><strong>Customer Detail</strong><span data-user></span></header><section class="content"><div class="toolbar"><div><h1>Customer</h1><p class="page-subtitle">Server-authorized customer detail.</p></div><a class="btn" href="customers.html">Back</a></div><div class="card" data-detail>Loading…</div></section></main><script type="module">import{bootstrap}from"../js/app.js";import{customers}from"../js/api/customers.js";import{escapeHtml,dateTime,badge}from"../js/utils/formatters.js";if(await bootstrap("customers")){const n=new URLSearchParams(location.search).get("name");try{const d=(await customers.get(n)).data;document.querySelector("[data-detail]").innerHTML='<dl class="detail"><dt>ID</dt><dd>'+escapeHtml(d.name)+'</dd><dt>Customer</dt><dd>'+escapeHtml(d.customer)+'</dd><dt>Status</dt><dd>'+badge(d.onboarding_status)+'</dd><dt>Segment</dt><dd>'+escapeHtml(d.segment)+'</dd><dt>Risk</dt><dd>'+escapeHtml(d.risk_level)+'</dd><dt>Approved By</dt><dd>'+escapeHtml(d.approved_by)+'</dd><dt>Modified</dt><dd>'+dateTime(d.modified)+'</dd><dt>Verification Notes</dt><dd>'+escapeHtml(d.verification_notes)+'</dd></dl>'}catch(e){document.querySelector("[data-detail]").innerHTML='<div class="alert error">'+escapeHtml(e.message)+"</div>"}}</script></body></html>
