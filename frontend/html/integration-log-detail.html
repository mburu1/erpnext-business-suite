<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Integration Detail — Business Suite</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/app.css"></head><body><div data-navigation></div><main class="main"><header class="topbar"><strong>Integration Detail</strong><span data-user></span></header><section class="content"><div class="toolbar"><div><h1>Integration Log</h1><p class="page-subtitle">Audit information returned by the API.</p></div><a class="btn" href="integrations.html">Back</a></div><div class="card" data-detail>Loading…</div></section></main><script type="module">import{bootstrap}from"../js/app.js";import{integrations}from"../js/api/integrations.js";import{escapeHtml,dateTime,badge}from"../js/utils/formatters.js";if(await bootstrap("integrations")){const n=new URLSearchParams(location.search).get("name");try{const d=(await integrations.get(n)).data;let h='<dl class="detail">';for(const[k,v]of Object.entries(d||{}))h+='<dt>'+escapeHtml(k.replaceAll("_"," "))+'</dt><dd>'+((k==="status")?badge(v):(k==="processed_at"||k==="modified")?dateTime(v):escapeHtml(v))+'</dd>';h+='</dl>';if(d?.status==="Failed")h+='<br><button class="btn primary" data-retry>Retry</button>';document.querySelector("[data-detail]").innerHTML=h;document.querySelector("[data-retry]")?.addEventListener("click",async()=>{try{await integrations.retry(d.name);location.reload()}catch(e){alert(e.message)}})}catch(e){document.querySelector("[data-detail]").innerHTML='<div class="alert error">'+escapeHtml(e.message)+"</div>"}}</script></body></html>
