<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — Business Suite</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/app.css"></head><body><main class="login-shell"><section class="card login-card"><h1>Business Suite</h1><p class="page-subtitle">Sign in with your ERPNext/Frappe account.</p><div id="error"></div><form id="login"><div class="field"><label>Username</label><input class="input" name="usr" required autocomplete="username"></div><br><div class="field"><label>Password</label><input class="input" type="password" name="pwd" required autocomplete="current-password"></div><br><button class="btn primary" type="submit">Sign in</button></form></section></main><script type="module">import{login}from"../js/auth/auth.js";document.querySelector("#login").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await login(f.get("usr"),f.get("pwd"))}catch(err){document.querySelector("#error").innerHTML='<div class="alert error">'+err.message+"</div>"}}</script></body></html>
