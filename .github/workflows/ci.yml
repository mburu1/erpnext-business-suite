name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python
        run: python -m compileall -q apps

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.13.1"

      - name: Lint Python
        run: ruff check apps/business_suite

      - name: Validate scaffold
        run: |
          test -f README.md
          test -f apps/business_suite/business_suite/hooks.py
