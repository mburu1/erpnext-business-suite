name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python
        run: python -m compileall -q apps scripts

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.13.1"

      - name: Lint Python
        run: ruff check apps/business_suite scripts

      - name: Validate scaffold
        run: |
          test -f README.md
          test -f apps/business_suite/business_suite/hooks.py
          test -f apps/business_suite/business_suite/security.py
          test -f apps/business_suite/business_suite/performance.py
          test -f apps/business_suite/business_suite/observability.py
          test -f docs/security/hardening.md
          test -f docs/performance/scalability.md
          test -f docs/observability/monitoring.md
          test -f pytest.ini

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "pytest>=8,<9"

      - name: Unit and quality hardening
        run: |
          pytest -q \
            apps/business_suite/business_suite/tests/test_unit_rbac.py \
            apps/business_suite/business_suite/tests/test_unit_workflows.py \
            apps/business_suite/business_suite/tests/test_quality_contracts.py \
            apps/business_suite/business_suite/tests/test_security_hardening.py \
            apps/business_suite/business_suite/tests/test_performance.py \
            apps/business_suite/business_suite/tests/test_observability.py

      - name: Integration validation
        run: python scripts/run_e2e_validation.py
